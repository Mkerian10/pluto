[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }

# gc_concurrent_allocation_churn coordinates many stop-the-world collections
# across 5 threads; on loaded CI runners it has repeatedly blown the default
# 60s kill window while being healthy (passes on rerun, 25x local stress
# clean, protocol audited). Give it real headroom.
[[profile.ci.overrides]]
filter = 'test(gc_concurrent_allocation_churn)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(gc_concurrent_allocation_churn)'
slow-timeout = { period = "60s", terminate-after = 3 }
