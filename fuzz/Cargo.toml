[package]
name = "pluto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Excluded from the root workspace (see ../Cargo.toml); this empty table
# makes the crate its own workspace so cargo-fuzz can build it in place.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }

[dependencies.pluto]
path = ".."

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

[[bin]]
name = "parse_src"
path = "fuzz_targets/parse_src.rs"
test = false
doc = false
